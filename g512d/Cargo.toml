[package]
name = "g512d"
description = "User service that owns the G512 keyboard and exposes lighting control over D-Bus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
g512-hidpp = { path = "../g512-hidpp" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
zbus = "5.13.2"

[dev-dependencies]
g512-hidpp = { path = "../g512-hidpp", features = ["fake"] }
